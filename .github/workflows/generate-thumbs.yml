name: Generate camera thumbnails

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-thumbs.yml"

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Diagnostic info
        run: |
          echo "Runner: $(uname -a)"
          echo "ffmpeg:"
          ffmpeg -version || true
          echo "Which ffmpeg: $(which ffmpeg || true)"
          echo "Disk space:"
          df -h .

      - name: Generate thumbnails
        shell: bash
        run: |

          set -uo pipefail

          mkdir -p thumbs

          cameras=(
          "veslarska1;https://kam.rijekaplus.sticker.hr/veslarska1/index.m3u8"
          "bacvarska1;https://kam.rijekaplus.sticker.hr/bacvarska1/index.m3u8"
          "henckea1;https://kam.rijekaplus.sticker.hr/henckea1/index.m3u8"
          "gardbrigade1;https://kam.rijekaplus.sticker.hr/gardbrigade1/index.m3u8"
          "jadranski1;https://kam.rijekaplus.sticker.hr/jadranski1/index.m3u8"
          "jadranski3;https://kam.rijekaplus.sticker.hr/jadranski3/index.m3u8"
          "jadranski360;https://kam.rijekaplus.sticker.hr/jadranski360/index.m3u8"
          "jadranski5;https://kam.rijekaplus.sticker.hr/jadranski5/index.m3u8"
          "jadranski4;https://kam.rijekaplus.sticker.hr/jadranski4/index.m3u8"
          "zabica1;https://kam.rijekaplus.sticker.hr/zabica1/index.m3u8"
          "zabica2;https://kam.rijekaplus.sticker.hr/zabica2/index.m3u8"
          "zabica360;https://kam.rijekaplus.sticker.hr/zabica360/index.m3u8"
          "opatija1;https://kam.cesterijeka.sticker.hr/opatija1/index.m3u8"
          "opatija2;https://kam.cesterijeka.sticker.hr/opatija2/index.m3u8"
          "opatija3;https://kam.cesterijeka.sticker.hr/opatija3/index.m3u8"
          "opatija4;https://kam.cesterijeka.sticker.hr/opatija4/index.m3u8"
          "k10x;https://kam.rijekaplus.sticker.hr/k10x/index.m3u8"
          "k15x;https://kam.rijekaplus.sticker.hr/k15x/index.m3u8"
          "k16x;https://kam.rijekaplus.sticker.hr/k16x/index.m3u8"
          "orehovica1;https://kam.rijekaplus.sticker.hr/orehovica1/index.m3u8"
          "orehovica2;https://kam.rijekaplus.sticker.hr/orehovica2/index.m3u8"
          "orehovica3;https://kam.rijekaplus.sticker.hr/orehovica3/index.m3u8"
          "orehovica4;https://kam.rijekaplus.sticker.hr/orehovica4/index.m3u8"
          )

          generate_thumb() {

            local id="$1"
            local url="$2"

            echo "📷 ${id}"

            # run ffmpeg but don't let a non-zero exit immediately stop the whole script
            rc=0
            timeout 30 ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -i "$url" \
              -frames:v 1 \
              -q:v 4 \
              -vf scale=560:-1 \
              "thumbs/${id}.jpg" \
              2>"thumbs/${id}.log" || rc=$?
            rc=${rc:-0}

            if [[ $rc -eq 0 && -s "thumbs/${id}.jpg" ]]; then
              rm -f "thumbs/${id}.log"
              echo "✅ ${id}"
            else
              echo "❌ ${id} (rc=${rc})"

              if [[ -f "thumbs/${id}.log" ]]; then
                echo "---- last 40 lines of thumbs/${id}.log ----"
                tail -40 "thumbs/${id}.log"
                echo "-----------------------------------------"
              fi
            fi

          }

          for camera in "${cameras[@]}"; do

            IFS=';' read -r id url <<< "$camera"

            [[ -z "$id" ]] && continue

            generate_thumb "$id" "$url"

          done

          echo
          echo "Generated files:"
          ls -lh thumbs

      - name: Test FTP/SFTP connectivity (diagnostics)
        run: |
          apt-get update -y
          apt-get install -y netcat-openbsd openssl lftp || true
          echo "Resolve:"
          nslookup ${{ secrets.FTP_SERVER }} || true
          echo "Check port 21 and 22:"
          nc -vz ${{ secrets.FTP_SERVER }} 21 || true
          nc -vz ${{ secrets.FTP_SERVER }} 22 || true
          echo "Try FTPS handshake (may fail for non-FTPS servers):"
          timeout 5 openssl s_client -connect ${{ secrets.FTP_SERVER }}:21 -starttls ftp </dev/null || true

      - name: Upload thumbnails via FTPS (non-fatal, primary)
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        continue-on-error: true
        id: ftps_upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./thumbs/
          server-dir: /slike/
          protocol: ftps
          port: 21
          security: loose

      - name: Fallback upload via lftp (retry) if FTPS failed
        if: ${{ steps.ftps_upload.outcome != 'success' && secrets.FTP_SERVER != '' }}
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y lftp || exit 0
          HOST="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"
          TARGET="/slike"
          # pokušaj do 5 puta, 15s pauza
          for i in 1 2 3 4 5; do
            echo "lftp attempt $i..."
            lftp -u "$USER","$PASS" -p 21 "$HOST" -e "\
              set ftp:passive-mode true; \
              set ftp:ssl-force true; \
              set ftp:ssl-protect-data true; \
              mirror -R --parallel=2 --verbose ./thumbs $TARGET; \
              bye" && { echo 'lftp upload succeeded'; exit 0; }
            echo "lftp attempt $i failed, sleeping..."
            sleep 15
          done
          echo "All lftp attempts failed"
          exit 1

      - name: Upload generated thumbs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbs
          path: thumbs/

      - name: Upload logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thumbs-logs
          path: thumbs/*.log

      - name: Commit thumbnails
        if: success()
        shell: bash
        run: |

          git config user.name "thumb-bot"
          git config user.email "thumb-bot@users.noreply.github.com"

          git add thumbs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update camera thumbnails [skip ci]" || ( echo "git commit failed" && exit 1 )
          git push
