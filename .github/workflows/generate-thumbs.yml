name: Generate camera thumbnails

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-thumbs.yml"

concurrency:
  group: thumbs-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
        
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Generate thumbnails
        shell: bash
        run: |

          set -uo pipefail

          mkdir -p thumbs

          cameras=(
          "veslarska1;https://kam.rijekaplus.sticker.hr/veslarska1/index.m3u8"
          "bacvarska1;https://kam.rijekaplus.sticker.hr/bacvarska1/index.m3u8"
          "henckea1;https://kam.rijekaplus.sticker.hr/henckea1/index.m3u8"
          "gardbrigade1;https://kam.rijekaplus.sticker.hr/gardbrigade1/index.m3u8"
          "jadranski1;https://kam.rijekaplus.sticker.hr/jadranski1/index.m3u8"
          "jadranski3;https://kam.rijekaplus.sticker.hr/jadranski3/index.m3u8"
          "jadranski360;https://kam.rijekaplus.sticker.hr/jadranski360/index.m3u8"
          "jadranski5;https://kam.rijekaplus.sticker.hr/jadranski5/index.m3u8"
          "jadranski4;https://kam.rijekaplus.sticker.hr/jadranski4/index.m3u8"
          "zabica1;https://kam.rijekaplus.sticker.hr/zabica1/index.m3u8"
          "zabica2;https://kam.rijekaplus.sticker.hr/zabica2/index.m3u8"
          "zabica360;https://kam.rijekaplus.sticker.hr/zabica360/index.m3u8"
          "opatija1;https://kam.cesterijeka.sticker.hr/opatija1/index.m3u8"
          "opatija2;https://kam.cesterijeka.sticker.hr/opatija2/index.m3u8"
          "opatija3;https://kam.cesterijeka.sticker.hr/opatija3/index.m3u8"
          "opatija4;https://kam.cesterijeka.sticker.hr/opatija4/index.m3u8"
          "k10x;https://kam.rijekaplus.sticker.hr/k10x/index.m3u8"
          "k15x;https://kam.rijekaplus.sticker.hr/k15x/index.m3u8"
          "k16x;https://kam.rijekaplus.sticker.hr/k16x/index.m3u8"
          "orehovica1;https://kam.rijekaplus.sticker.hr/orehovica1/index.m3u8"
          "orehovica2;https://kam.rijekaplus.sticker.hr/orehovica2/index.m3u8"
          "orehovica3;https://kam.rijekaplus.sticker.hr/orehovica3/index.m3u8"
          "orehovica4;https://kam.rijekaplus.sticker.hr/orehovica4/index.m3u8"
          )

          generate_thumb() {

            local id="$1"
            local url="$2"

            echo "📷 ${id}"

            rc=0
            timeout 30 ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -i "$url" \
              -frames:v 1 \
              -q:v 4 \
              -vf scale=560:-1 \
              "thumbs/${id}.jpg" \
              2>"thumbs/${id}.log" || rc=$?
            rc=${rc:-0}

            if [[ $rc -eq 0 && -s "thumbs/${id}.jpg" ]]; then
              rm -f "thumbs/${id}.log"
              echo "✅ ${id}"
            else
              echo "❌ ${id} (rc=${rc})"

              if [[ -f "thumbs/${id}.log" ]]; then
                tail -20 "thumbs/${id}.log"
              fi
            fi

          }

          for camera in "${cameras[@]}"; do

            IFS=';' read -r id url <<< "$camera"

            [[ -z "$id" ]] && continue

            generate_thumb "$id" "$url"

          done

          echo
          echo "Generated files:"
          ls -lh thumbs

      - name: Upload thumbnails via FTPS (non-fatal, primary)
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        continue-on-error: true
        id: ftps_upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./thumbs/
          server-dir: /slike/
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000

      - name: Fallback upload via lftp (retry) if FTPS failed
        if: ${{ steps.ftps_upload.outcome != 'success' && env.FTP_SERVER != '' }}
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y lftp || true
          HOST="$FTP_SERVER"
          USER="$FTP_USERNAME"
          PASS="$FTP_PASSWORD"
          TARGET="/slike"
          
          for i in 1 2 3 4 5; do
            echo "lftp attempt $i..."
            lftp -u "$USER","$PASS" -p 21 "$HOST" -e "set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:connect-timeout 15; set net:timeout 15; mirror -R --parallel=2 --verbose ./thumbs $TARGET; bye" && echo 'lftp upload succeeded' && exit 0 || true
            echo "lftp attempt $i failed, sleeping..."
            sleep $((i * 5))
          done
          echo "All lftp attempts failed"
          exit 1

      - name: Upload generated thumbs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbs
          path: thumbs/

      - name: Upload logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thumbs-logs
          path: thumbs/*.log

      - name: Commit thumbnails
        if: success()
        shell: bash
        run: |

          git config user.name "thumb-bot"
          git config user.email "thumb-bot@users.noreply.github.com"

          git add thumbs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update camera thumbnails [skip ci]"
          git push
